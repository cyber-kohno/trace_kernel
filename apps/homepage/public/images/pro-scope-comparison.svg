    <text x="560" y="215" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#ffffff">Trace Kernel</text>

    <rect x="458" y="288" width="204" height="54" rx="16" fill="#f4f8fc" stroke="#dce7f2"/>
    <path d="M495 315 h42 M554 315 h72" stroke="#475569" stroke-width="7" stroke-linecap="round" opacity="0.38"/>
    <circle cx="486" cy="315" r="8" fill="#0f766e"/>
