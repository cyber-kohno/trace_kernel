    <rect x="834" y="328" width="170" height="88" rx="14" fill="#fff8ed" stroke="#f0d7b6"/>
    <path d="M860 384 h118" stroke="#b45309" stroke-width="10" stroke-linecap="round" opacity="0.34"/>
    <path d="M880 354 h78 v42 h-78 z" fill="none" stroke="#b45309" stroke-width="7" stroke-linejoin="round"/>
    <path d="M880 366 h78" stroke="#b45309" stroke-width="7"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="725" cy="260" r="44" fill="#ffffff"/>
    <path d="M725 231 l26 46 h-52 z" fill="#f6c65b" stroke="#b45309" stroke-width="4" stroke-linejoin="round"/>
