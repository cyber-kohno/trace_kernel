    <rect x="806" y="84" width="226" height="152" rx="24" fill="#ffffff"/>
    <rect x="842" y="120" width="154" height="80" rx="16" fill="url(#softTeal)" stroke="#cde9e4"/>
    <path d="M876 164 h84" stroke="#0f766e" stroke-width="11" stroke-linecap="round" opacity="0.45"/>
    <path d="M881 145 l17 17 34 -38" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

