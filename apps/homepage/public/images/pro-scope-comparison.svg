  <path d="M714 308 C748 342 768 364 788 374" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrowTeal)"/>

  <path d="M612 396 C628 440 668 462 724 462 C782 462 828 440 852 414" stroke="#d6a044" stroke-width="4" fill="none" stroke-dasharray="8 10"/>
  <path d="M612 396 C628 440 668 462 724 462" stroke="#d6a044" stroke-width="4" fill="none"/>

  <g transform="translate(464 424)">
    <rect width="192" height="38" rx="19" fill="#ffffff" stroke="#dfe7f2"/>
    <path d="M47 19 h98" stroke="#64748b" stroke-width="7" stroke-linecap="round" opacity="0.32"/>
