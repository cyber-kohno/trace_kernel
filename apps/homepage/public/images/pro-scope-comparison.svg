<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Pro caution boundary</title>
  <desc id="desc">Trace Kernel Pro can reach external programs and local files, so the workflow includes a confirmation boundary before changes affect the outside environment.</desc>
  <defs>
    <linearGradient id="kernel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#14263a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="softTeal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eefaf7"/>
      <stop offset="100%" stop-color="#f8fcfb"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M2 2 L11 6.5 L2 11 Z" fill="#2563a8"/>
    </marker>
    <marker id="arrowTeal" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M2 2 L11 6.5 L2 11 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1120" height="520" rx="30" fill="#f7f9fc"/>

  <g opacity="0.72">
    <circle cx="132" cy="118" r="82" fill="#eaf2fb"/>
    <circle cx="1002" cy="400" r="92" fill="#eaf7f4"/>
    <circle cx="872" cy="88" r="34" fill="#f4e9d9"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="154" width="250" height="212" rx="24" fill="#ffffff"/>
    <rect x="116" y="192" width="186" height="132" rx="18" fill="url(#softBlue)" stroke="#d8e7f7"/>
    <path d="M154 244 h110 M154 270 h82" stroke="#2563a8" stroke-width="12" stroke-linecap="round" opacity="0.32"/>
    <circle cx="154" cy="213" r="13" fill="#2563a8" opacity="0.75"/>
    <circle cx="191" cy="213" r="13" fill="#2563a8" opacity="0.48"/>
    <circle cx="228" cy="213" r="13" fill="#2563a8" opacity="0.28"/>
