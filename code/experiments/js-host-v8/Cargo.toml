[package]
name = "trace-kernel-js-host-v8-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
trace-kernel-native-core = { path = "../../crates/native-core" }
deno_core = { version = "=0.412.0", features = ["include_icu_data"] }
deno_error = "=0.7.1"
deno_web = "=0.290.0"
deno_webidl = "=0.259.0"
tokio = { version = "=1.48.0", features = ["rt", "macros", "time", "sync"] }
serde_json = "=1.0.145"
encoding_rs = "=0.8.35"

[profile.release]
opt-level = "s"
lto = true
strip = true
