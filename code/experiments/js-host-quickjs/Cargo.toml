[package]
name = "trace-kernel-js-host-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rquickjs = { version = "=0.14.0", features = ["futures"] }
tokio = { version = "=1.48.0", features = ["rt", "macros", "time"] }
serde_json = "=1.0.145"
encoding_rs = "=0.8.35"

[profile.release]
opt-level = "s"
lto = true
strip = true
