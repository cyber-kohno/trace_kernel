[package]
name = "trace-kernel-cli"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
trace-kernel-native-core = { path = "../../crates/native-core" }
deno_core = { version = "=0.412.0", features = ["include_icu_data"] }
deno_error = "=0.7.1"
deno_web = "=0.290.0"
deno_webidl = "=0.259.0"
tokio = { version = "=1.48.0", features = ["rt", "macros", "time", "sync", "signal"] }
serde_json = "=1.0.145"
dirs = "=6.0.0"

[build-dependencies]
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
opt-level = "s"
lto = true
strip = true
