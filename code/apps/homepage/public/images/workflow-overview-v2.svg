<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Trace Kernelの基本ワークフロー</title>
  <desc id="desc">ワークスペースを開き、contextを登録し、workを追加し、TypeScriptを書いて実行結果を確認する流れ。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38516f" />
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8da3" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#12253d" flood-opacity="0.12" />
    </filter>
    <style>
      .bg { fill: #f6f8fb; }
      .panel { fill: #ffffff; stroke: #d9e1eb; stroke-width: 1.5; filter: url(#shadow); }
      .workspace { fill: #f9fbfe; stroke: #95abc3; stroke-width: 2; }
      .soft { fill: #eef4fa; stroke: #c6d4e4; stroke-width: 1.5; }
      .accent { fill: #e7f4f1; stroke: #79b8ac; stroke-width: 1.5; }
      .run { fill: #eaf1ff; stroke: #8da9df; stroke-width: 1.5; }
      .title { font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d2f45; }
      .label { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20354d; }
      .text { font: 500 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #53657a; }
      .small { font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #66778b; }
      .code { font: 600 15px Consolas, "Liberation Mono", monospace; fill: #24415f; }
      .arrow { stroke: #38516f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #7b8da3; stroke-width: 2.2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow-soft); }
    </style>
  </defs>

  <rect class="bg" width="1120" height="560" rx="28" />

  <text class="title" x="52" y="58">基本ワークフロー</text>
  <text class="text" x="52" y="86">入力や設定をcontextとして登録し、workにTypeScriptを書いて、その場で実行結果を確認します。</text>

  <rect class="panel" x="52" y="124" width="190" height="112" rx="18" />
  <text class="label" x="80" y="164">1. 開く</text>
  <text class="text" x="80" y="194">空白ワークスペース</text>
  <text class="text" x="80" y="216">または .trk</text>

  <path class="arrow" d="M 252 180 C 278 180, 292 180, 318 180" />

  <rect class="workspace" x="318" y="114" width="436" height="288" rx="24" />
  <text class="label" x="348" y="154">workspace</text>
  <text class="small" x="348" y="178">contextとworkを同じ作業単位で管理</text>

  <rect class="accent" x="348" y="208" width="176" height="138" rx="16" />
  <text class="label" x="374" y="246">2. context</text>
  <text class="text" x="374" y="276">env / resource</text>
  <text class="text" x="374" y="300">dataset</text>
  <text class="code" x="374" y="326">$resource.userData</text>

  <rect class="soft" x="548" y="208" width="176" height="138" rx="16" />
  <text class="label" x="578" y="246">3. work</text>
  <text class="text" x="578" y="276">実行する処理を</text>
  <text class="text" x="578" y="300">作業単位として追加</text>

  <path class="arrow" d="M 524 277 C 532 277, 538 277, 548 277" />

  <path class="arrow" d="M 754 260 C 782 260, 796 260, 824 260" />

  <rect class="panel" x="824" y="124" width="244" height="112" rx="18" />
  <text class="label" x="854" y="164">4. プログラムを書く</text>
  <text class="text" x="854" y="194">補完付きのMonacoエディタで</text>
  <text class="code" x="854" y="218">TypeScript</text>

  <path class="arrow" d="M 946 246 C 946 274, 946 292, 946 320" />

  <rect class="run" x="824" y="320" width="244" height="112" rx="18" />
  <text class="label" x="854" y="360">5. 実行して確認</text>
  <text class="text" x="854" y="390">Run / F5 / Alt + Enter</text>
  <text class="text" x="854" y="412">出力パネルで結果を見る</text>

  <path class="arrow-soft" d="M 824 380 C 690 486, 488 492, 436 356" />
  <rect class="soft" x="388" y="452" width="348" height="58" rx="14" />
  <text class="small" x="420" y="486">必要に応じて、結果をresourceとして登録し、別のworkにつなげる</text>
</svg>
