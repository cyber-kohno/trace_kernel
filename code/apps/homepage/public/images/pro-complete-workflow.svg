<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Standard and Pro boundary</title>
  <desc id="desc">The standard area stays inside the Trace Kernel workspace for resource analysis and result checking, while the Pro area crosses a boundary to external programs and real file updates.</desc>
  <defs>
    <linearGradient id="kernel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#14263a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="standardPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f9fbff"/>
    </linearGradient>
    <linearGradient id="proPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#effaf7"/>
      <stop offset="100%" stop-color="#fffaf0"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563a8"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1120" height="460" rx="30" fill="#f7f9fc"/>
  <circle cx="104" cy="86" r="70" fill="#eaf2fb" opacity="0.85"/>
  <circle cx="1006" cy="360" r="92" fill="#eaf7f4" opacity="0.86"/>

  <g filter="url(#shadow)">
    <rect x="84" y="86" width="444" height="300" rx="30" fill="url(#standardPanel)" stroke="#dce8f5"/>
    <rect x="122" y="132" width="188" height="190" rx="24" fill="#ffffff"/>
    <path d="M158 178 h106 M158 206 h78" stroke="#2563a8" stroke-width="11" stroke-linecap="round" opacity="0.34"/>
    <path d="M158 254 h112" stroke="#2563a8" stroke-width="10" stroke-linecap="round" opacity="0.22"/>
    <circle cx="158" cy="286" r="10" fill="#2563a8" opacity="0.52"/>
    <circle cx="190" cy="286" r="10" fill="#2563a8" opacity="0.34"/>
    <circle cx="222" cy="286" r="10" fill="#2563a8" opacity="0.2"/>

    <rect x="338" y="132" width="148" height="190" rx="24" fill="#ffffff"/>
    <rect x="366" y="170" width="92" height="34" rx="10" fill="#eef6ff" stroke="#d4e5f7"/>
    <rect x="366" y="222" width="92" height="34" rx="10" fill="#eef6ff" stroke="#d4e5f7"/>
    <path d="M384 187 h56 M384 239 h38" stroke="#334155" stroke-width="7" stroke-linecap="round" opacity="0.32"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="592" y="86" width="444" height="300" rx="30" fill="url(#proPanel)" stroke="#d9eee7"/>
    <rect x="638" y="126" width="156" height="110" rx="24" fill="#ffffff"/>
    <circle cx="690" cy="181" r="30" fill="#eef8f6" stroke="#cce8e2" stroke-width="2"/>
    <path d="M678 176 h24 M678 188 h18" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>
    <path d="M704 168 l14 13 -14 13" fill="none" stroke="#2563a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="834" y="126" width="156" height="110" rx="24" fill="#ffffff"/>
    <path d="M876 190 h72" stroke="#0f766e" stroke-width="10" stroke-linecap="round" opacity="0.38"/>
    <path d="M880 164 h64 v44 h-64 z" fill="none" stroke="#0f766e" stroke-width="7" stroke-linejoin="round"/>

    <rect x="736" y="272" width="156" height="78" rx="22" fill="#ffffff"/>
    <path d="M772 314 h84" stroke="#b45309" stroke-width="10" stroke-linecap="round" opacity="0.34"/>
    <path d="M785 292 h56 v43 h-56 z" fill="none" stroke="#b45309" stroke-width="7" stroke-linejoin="round"/>
    <path d="M785 305 h56" stroke="#b45309" stroke-width="7"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="456" y="158" width="208" height="146" rx="28" fill="#ffffff"/>
    <rect x="488" y="190" width="144" height="58" rx="18" fill="url(#kernel)"/>
    <text x="560" y="227" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">Trace Kernel</text>
    <circle cx="560" cy="278" r="11" fill="#0f766e"/>
  </g>

  <path d="M282 227 C330 226 386 226 452 226" stroke="#2563a8" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M666 226 C696 212 720 194 750 182" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M664 252 C716 292 736 306 764 312" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M794 182 C808 182 820 182 830 182" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrowTeal)"/>

  <path d="M560 70 V392" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="9 12" opacity="0.75"/>
  <g transform="translate(509 58)" filter="url(#shadow)">
    <rect width="102" height="32" rx="16" fill="#ffffff" stroke="#dce7f2"/>
    <path d="M31 16 h40" stroke="#64748b" stroke-width="6" stroke-linecap="round" opacity="0.38"/>
  </g>

  <g transform="translate(192 346)">
    <rect width="228" height="40" rx="20" fill="#ffffff" stroke="#dbe7f4"/>
    <path d="M46 20 h136" stroke="#2563a8" stroke-width="7" stroke-linecap="round" opacity="0.32"/>
  </g>
  <g transform="translate(702 346)">
    <rect width="228" height="40" rx="20" fill="#ffffff" stroke="#cfe9e3"/>
    <path d="M46 20 h136" stroke="#0f766e" stroke-width="7" stroke-linecap="round" opacity="0.32"/>
  </g>
</svg>
