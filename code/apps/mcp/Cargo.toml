[package]
name = "trace-kernel-mcp"
version = "0.2.0"
edition = "2021"
publish = false

[build-dependencies]
trace-kernel-mcp-protocol = { path = "../../crates/mcp-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
trace-kernel-mcp-protocol = { path = "../../crates/mcp-protocol" }
anyhow = "1.0"
rmcp = { version = "3.4.0", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
# Compile the real native bridge source for loopback integration tests only.
uuid = { version = "1", features = ["v4"] }
