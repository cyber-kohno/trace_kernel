[package]
name = "trace-kernel-native-core"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
encoding_rs = "=0.8.35"
encoding_rs_io = "=0.1.7"
glob = "=0.3.3"
regex = "=1.12.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_bytes = "=0.11.19"
serde_json = "=1.0.145"
thiserror = "=1.0.69"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
reqwest = { version = "=0.12.24", features = ["json", "blocking", "rustls-tls"] }
chrono = { version = "=0.4.42", features = ["serde"] }
once_cell = "=1.21.3"
url = "2.4"
calamine = "=0.23.1"
roxmltree = "=0.20.0"
scraper = "=0.20.0"
ego-tree = "=0.6.3"
zip = { version = "=0.6.6", default-features = false }

uuid = { version = "=1.18.1", features = ["v4"] }
