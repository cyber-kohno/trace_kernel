<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Trace Kernel and external tools</title>
  <desc id="desc">Trace Kernel work and logic call external tools such as fd, rg, internal CLI, and converters, then receive stdout, stderr, and exitCode.</desc>
  <defs>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowOut" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2861a3"/>
    </marker>
    <marker id="arrowBack" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1120" height="520" rx="28" fill="#f7f9fc"/>

  <text x="560" y="54" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="#172033">
    外部ツールをTrace Kernelの作業フローに接続する
  </text>
  <text x="560" y="84" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#5c667a">
    work / logicから既存CLIや社内ツールを呼び出し、結果を再びTypeScriptで扱う
  </text>

  <g filter="url(#shadow)">
    <rect x="78" y="166" width="232" height="188" rx="18" fill="#ffffff"/>
    <rect x="102" y="198" width="184" height="34" rx="8" fill="#eef6ff" stroke="#d4e6fb"/>
    <text x="194" y="220" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">
      resource / dataset
    </text>
    <rect x="102" y="248" width="184" height="34" rx="8" fill="#eef6ff" stroke="#d4e6fb"/>
    <text x="194" y="270" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">
      env
    </text>
    <text x="194" y="319" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#234f86">
      Trace Kernelの入力
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="400" y="142" width="320" height="236" rx="22" fill="#ffffff"/>
    <rect x="430" y="176" width="260" height="62" rx="14" fill="#172033"/>
    <text x="560" y="202" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">
      Trace Kernel
    </text>
    <text x="560" y="224" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">
      work / logic
    </text>

    <rect x="442" y="268" width="236" height="36" rx="9" fill="#f5f8ff" stroke="#d8e5fb"/>
    <text x="560" y="291" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">
      $process.tool(args)
    </text>
    <rect x="442" y="316" width="236" height="36" rx="9" fill="#f0fbf8" stroke="#ccebe5"/>
    <text x="560" y="339" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">
      結果を整形・次の処理へ
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="812" y="118" width="230" height="306" rx="18" fill="#ffffff"/>
    <text x="927" y="154" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0f766e">
      外部プログラム
    </text>

    <g transform="translate(840 184)">
      <rect width="174" height="40" rx="10" fill="#f0fbf8" stroke="#ccebe5"/>
      <text x="87" y="26" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">fd</text>
    </g>
    <g transform="translate(840 238)">
      <rect width="174" height="40" rx="10" fill="#f0fbf8" stroke="#ccebe5"/>
      <text x="87" y="26" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">rg</text>
    </g>
    <g transform="translate(840 292)">
      <rect width="174" height="40" rx="10" fill="#f0fbf8" stroke="#ccebe5"/>
      <text x="87" y="26" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">社内CLI</text>
    </g>
    <g transform="translate(840 346)">
      <rect width="174" height="40" rx="10" fill="#f0fbf8" stroke="#ccebe5"/>
      <text x="87" y="26" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">変換ツール</text>
    </g>
  </g>

  <path d="M314 260 H392" stroke="#2861a3" stroke-width="3" fill="none" marker-end="url(#arrowOut)"/>
  <text x="353" y="244" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#2861a3">
    入力
  </text>

  <path d="M724 236 C758 218 776 207 806 204" stroke="#2861a3" stroke-width="3" fill="none" marker-end="url(#arrowOut)"/>
  <path d="M724 282 C758 282 776 262 806 258" stroke="#2861a3" stroke-width="3" fill="none" marker-end="url(#arrowOut)"/>
  <path d="M724 328 C758 346 776 366 806 366" stroke="#2861a3" stroke-width="3" fill="none" marker-end="url(#arrowOut)"/>
  <text x="764" y="238" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#2861a3">
    呼び出し
  </text>

  <path d="M806 406 C744 458 642 456 588 384" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrowBack)"/>
  <text x="700" y="462" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#0f766e">
    stdout / stderr / exitCode
  </text>

  <g transform="translate(326 426)">
    <rect width="468" height="46" rx="23" fill="#ffffff" stroke="#dfe7f2"/>
    <text x="234" y="29" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">
      外部ツールは単体で保ち、呼び出し順序や結果整形をTrace Kernel側で記述する
    </text>
  </g>
</svg>
