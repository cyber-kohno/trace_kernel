<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trace Kernel</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 0%, rgba(20, 184, 166, 0.16), transparent 42%),
          linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      }

      .splash {
        display: grid;
        justify-items: center;
        gap: 16px;
        transform: translateY(-2px);
      }

      .logo {
        width: 92px;
        height: 92px;
        filter: drop-shadow(0 14px 24px rgba(15, 23, 42, 0.14));
      }

      .name {
        font-size: 28px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0;
      }

      .caption {
        color: #64748b;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .bar {
        position: relative;
        width: 148px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #dbe4ee;
      }

      .bar::after {
        content: "";
        position: absolute;
        inset-block: 0;
        left: -45%;
        width: 45%;
        border-radius: inherit;
        background: #14b8a6;
        animation: load 1.1s ease-in-out infinite;
      }

      @keyframes load {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(322%);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="Trace Kernel is starting">
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Trace Kernel">
        <path d="M124 134h264" stroke="#172554" stroke-width="50" stroke-linecap="round" />
        <path d="M256 134v246" stroke="#172554" stroke-width="50" stroke-linecap="round" />
        <path d="M302 254l90-114" stroke="#334155" stroke-width="50" stroke-linecap="round" />
        <path d="M302 258l98 122" stroke="#334155" stroke-width="50" stroke-linecap="round" />
        <rect x="220" y="220" width="72" height="72" rx="16" fill="#14b8a6" />
        <path d="M244 256h24M256 244v24" stroke="#f8fafc" stroke-width="11" stroke-linecap="round" />
      </svg>
      <div class="name">Trace Kernel</div>
      <div class="caption">Preparing workspace runtime</div>
      <div class="bar" aria-hidden="true"></div>
    </main>
  </body>
</html>
